name: chatlog_vision
description: ChatLog Vision - The Smarter Way to Connect
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Design
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_animate: ^4.2.0+1
  shimmer: ^3.0.0
  
  # State Management
  provider: ^6.1.0
  riverpod: ^2.4.0
  
  # Networking
  dio: ^5.3.1
  socket_io_client: ^2.0.0
  
  # Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.17.0
  firebase_messaging: ^14.8.0
  firebase_storage: ^11.6.0
  
  # Utilities
  get: ^4.6.6
  intl: ^0.19.0
  uuid: ^4.0.0
  shared_preferences: ^2.2.2
  
  # Multimedia
  image_picker: ^1.0.4
  video_player: ^2.8.1
  camera: ^0.10.5+2
  just_audio: ^0.9.34
  
  # Security
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.14

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
